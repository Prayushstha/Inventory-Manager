name: Build installers

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: windows-installer
            files: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            command: npm run build:linux
            artifact: linux-installer
            files: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
